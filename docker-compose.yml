services:
  mongo:
    image: mongo:8
    container_name: floodrisk-mongo
    profiles: [core]
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: floodrisk
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - floodrisk-net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodrisk-api
    profiles: [api]
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=floodrisk
      # Groq AI key comes from the gitignored .env (GROQ_API_KEY). Without it, AI calls 401.
      - AI__ApiKey=${GROQ_API_KEY:-}
      - Geoapify__ApiKey=${GEOAPIFY_KEY:-}
      # Nationwide parcel (property lot) lookups via ReportAll; without it, searches use the geocoded point.
      - ReportAll__ClientKey=${REPORTALL_CLIENT_KEY:-}
      # Current lot grading from Google's aerial surface (Solar API); optional.
      - GoogleSolar__ApiKey=${GOOGLE_SOLAR_KEY:-}
      # Human check before the app (code | turnstile | off) + session pass signing.
      - HumanCheck__Mode=${HUMAN_CHECK_MODE:-code}
      - Turnstile__SiteKey=${TURNSTILE_SITE_KEY:-}
      - Turnstile__SecretKey=${TURNSTILE_SECRET_KEY:-}
      - Session__SigningKey=${SESSION_SIGNING_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - floodrisk-net

volumes:
  mongo-data:

networks:
  floodrisk-net:
    driver: bridge
